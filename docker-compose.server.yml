# Production on the DigitalOcean droplet, beside the FastAPI stack in /opt/fastapi.
#
#   cd /opt/data-ai-solutions
#   docker compose -f docker-compose.server.yml up -d --build
#
# No published port: the site is reachable only through the fastapi stack's
# nginx, which proxies data-ai-systems.com to this container by name over the
# shared `fastapi_default` network and sends /auth, /trading, /api, /CRUD to
# the API container. NEXT_PUBLIC_API_URL is empty on purpose -- same origin.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-ai-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=
      - API_BACKEND_URL=http://app:8000
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: fastapi_default
    external: true
